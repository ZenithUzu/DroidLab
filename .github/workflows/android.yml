name: DroidLab Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/droidlab-android-sdk"
          tools_zip="$RUNNER_TEMP/droidlab-commandline-tools.zip"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$tools_zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdkmanager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --sdk_root="$sdk_dir" --licenses > /dev/null
          "$sdkmanager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - run: python3 -m py_compile engine/droidlab.py
      - uses: actions/upload-artifact@v4
        with:
          name: DroidLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
