plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.zenithuzu.droidlab'
    compileSdk 35

    sourceSets.main {
        jniLibs.srcDir layout.buildDirectory.dir('generated/nativeEngine/jniLibs')
        assets.srcDir layout.buildDirectory.dir('generated/nativeEngine/assets')
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libdroidlab_qemu.so', '**/libdlq_*.so']
        }
    }

    defaultConfig {
        applicationId 'com.zenithuzu.droidlab'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.tukaani:xz:1.10'
    testImplementation 'junit:junit:4.13.2'
}
